name: Deploy to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    # Build Docker image
    - name: Build Docker image
      run: |
        docker build -f Dockerfile.azure -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/django-todo:${{ github.sha }} .
    
    # Login to Azure Container Registry
    - name: Login to Azure Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    
    # Push image to ACR with both SHA and latest tags
    - name: Push image to ACR
      run: |
        docker tag ${{ secrets.REGISTRY_LOGIN_SERVER }}/django-todo:${{ github.sha }} ${{ secrets.REGISTRY_LOGIN_SERVER }}/django-todo:latest
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/django-todo:${{ github.sha }}
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/django-todo:latest
    
    # Deploy to Azure App Service
    - name: Deploy to Azure App Service
      uses: Azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.APP_NAME }}
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        images: ${{ secrets.REGISTRY_LOGIN_SERVER }}/django-todo:${{ github.sha }}
    
    # Post-deployment health check
    - name: Health check
      run: |
        sleep 10
        curl -f https://${{ secrets.APP_NAME }}.azurewebsites.net/ || exit 1
      continue-on-error: true
